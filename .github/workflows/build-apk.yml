name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show Files
        run: |
          ls -la
          ls -la www || echo "www missing"
          cat package.json || echo "no package.json"

      - name: Force Install Capacitor
        run: |
          # Chahe package.json me kuch bhi ho, Capacitor zabardasti install karo
          npm install --legacy-peer-deps
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 --legacy-peer-deps
          ls node_modules/.bin/cap && echo "CAP MIL GAYA"

      - name: Create Config If Missing
        run: |
          if [ ! -f capacitor.config.ts ]; then
            echo "import type { CapacitorConfig } from '@capacitor/cli'; const config: CapacitorConfig = { appId: 'com.kifaalat.fund', appName: 'Kifaalat-e-Miyyat Fund', webDir: 'www' }; export default config;" > capacitor.config.ts
          fi
          if [ ! -d www ]; then
            mkdir -p www
            cp *.html www/ 2>/dev/null || echo "koi html nahi mili"
          fi
          cat capacitor.config.ts
          ls -la www

      - name: Build APK
        run: |
          ./node_modules/.bin/cap add android || echo "android already exists"
          ./node_modules/.bin/cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kifaalat-fund-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
