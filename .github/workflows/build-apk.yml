name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Pure Android Project
        run: |
          rm -rf android node_modules package-lock.json capacitor.config.ts capacitor.config.js
          
          # 1. SAB SE PEHLE DEKHO REPO ME HAI KYA?
          echo "=== REPO ME FILES ==="
          ls -la
          echo "=== WWW ME FILES ==="
          ls -la www/ 2>/dev/null || echo "www folder nahi hai"
          
          # 2. www banao aur saari html andar daalo
          mkdir -p www
          cp *.html www/ 2>/dev/null || true
          
          # 3. AGAR index.html NAHI HAI TO PEHLI HTML KO index.html BANA DO - YEHI ASAL FIX HAI
          if [ ! -f www/index.html ]; then
            FIRST_HTML=$(ls www/*.html 2>/dev/null | head -n 1)
            echo "index.html nahi mili, mili hai: $FIRST_HTML"
            if [ -n "$FIRST_HTML" ]; then
              cp "$FIRST_HTML" www/index.html
              echo "Copy kar di index.html bana di"
            else
              echo "KOI HTML HI NAHI MILI! TEST PAGE BANA RAHA HOON"
              echo "<h1>HTML file nahi mili</h1><p>Repo me .html file daalen</p>" > www/index.html
            fi
          fi
          echo "=== FINAL WWW ==="
          ls -lh www/
          cat www/index.html | head -n 20
          
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/java/com/kifaalat/fund
          cp -r www android/app/src/main/assets/www
          echo "=== ASSETS ME ==="
          ls -R android/app/src/main/assets/www
          
          cat > android/settings.gradle << 'EOF'
          rootProject.name = "KifaalatFund"
          include ':app'
          EOF
          
          cat > android/build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.5.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          cat > android/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.kifaalat.fund'
            compileSdk 34
            defaultConfig {
              applicationId "com.kifaalat.fund"
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Kifaalat-e-Miyyat Fund" android:theme="@style/Theme.AppCompat.Light.NoActionBar" android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          
          # NAYA MainActivity - AB FILE ACCESS FULL ON HAI + ERROR DIKHAYEGA
          cat > android/app/src/main/java/com/kifaalat/fund/MainActivity.java << 'EOF'
          package com.kifaalat.fund;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView webView = new WebView(this);
              setContentView(webView);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              s.setAllowFileAccessFromFileURLs(true);
              s.setAllowUniversalAccessFromFileURLs(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              s.setLoadWithOverviewMode(true);
              s.setUseWideViewPort(true);
              webView.setWebChromeClient(new WebChromeClient());
              webView.setWebViewClient(new WebViewClient());
              webView.loadUrl("file:///android_asset/www/index.html");
            }
          }
          EOF
          echo "Project ban gaya!"

      - name: Build APK with Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Gradle Build
        run: |
          cd android && gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kifaalat-fund-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
