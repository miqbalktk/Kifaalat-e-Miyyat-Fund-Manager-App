name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Pure Android Project
        run: |
          rm -rf android node_modules package-lock.json capacitor.config.ts capacitor.config.js
          
          # --- YAHAN FIX HAI: HTML DHUNDO ---
          mkdir -p www
          # Agar www khaali hai to root se html copy karo
          if [ -z "$(ls -A www)" ]; then
            cp *.html www/ 2>/dev/null || echo "root me html nahi mili"
          fi
          echo "=== www me kya hai? ==="
          ls -la www
          ls -la *.html 2>/dev/null || echo "root me koi html nahi"
          
          # Agar index.html nahi hai, to pehli wali html ko hi index.html bana do
          if [ ! -f www/index.html ]; then
            FIRST_HTML=$(ls www/*.html 2>/dev/null | head -n 1)
            if [ -n "$FIRST_HTML" ]; then
              echo "index.html nahi mili, $FIRST_HTML ko index.html bana raha hoon"
              cp "$FIRST_HTML" www/index.html
            fi
          fi
          ls -la www/
          
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/java/com/kifaalat/fund
          cp -r www android/app/src/main/assets/www
          
          cat > android/settings.gradle << 'EOF'
          rootProject.name = "KifaalatFund"
          include ':app'
          EOF
          
          cat > android/build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.5.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat > android/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF
          
          cat > android/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.kifaalat.fund'
            compileSdk 34
            defaultConfig {
              applicationId "com.kifaalat.fund"
              minSdk 24
              targetSdk 34
              versionCode 2
              versionName "1.1"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="Kifaalat-e-Miyyat Fund" android:theme="@style/Theme.AppCompat.Light.NoActionBar" android:allowBackup="true" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          
          # --- MainActivity - AB ERROR BHI DIKHAYEGA ---
          cat > android/app/src/main/java/com/kifaalat/fund/MainActivity.java << 'EOF'
          package com.kifaalat.fund;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView webView = new WebView(this);
              setContentView(webView);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              s.setAllowFileAccessFromFileURLs(true);
              s.setAllowUniversalAccessFromFileURLs(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              webView.setWebChromeClient(new WebChromeClient());
              webView.setWebViewClient(new WebViewClient() {
                @Override public void onReceivedError(WebView view, int errorCode, String description, String failingUrl) {
                  Toast.makeText(MainActivity.this, "Error: " + description, Toast.LENGTH_LONG).show();
                }
              });
              webView.loadUrl("file:///android_asset/www/index.html");
            }
            @Override public void onBackPressed() { super.onBackPressed(); }
          }
          EOF
          echo "Project ban gaya!"

      - name: Build APK with Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Gradle Build
        run: |
          cd android && gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kifaalat-fund-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
